name: Build FLYINGCUBE DREAMCAST

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget libelf-dev libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex libssl-dev libpng-dev

      - name: Setup KallistiOS Directory Structure
        run: |
          echo "Setting up official KallistiOS paths (/opt/toolchains/dc)..."
          sudo mkdir -p /opt/toolchains/dc
          sudo chown -R $USER:$USER /opt/toolchains/dc
          
          # KallistiOS'u doğrudan doğruya beklenen dizine klonluyoruz
          git clone https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
          
          cd /opt/toolchains/dc/kos
          cp doc/environ.sh.sample environ.sh

      - name: Compile FLYINGCUBE_DREAMCAST.c
        run: |
          export KOS_BASE=/opt/toolchains/dc/kos
          export KOS_PORTS=/opt/toolchains/dc/kos-ports
          
          # Environ dosyasını yükle
          source $KOS_BASE/environ.sh

          echo "Compiling FLYINGCUBE_DREAMCAST.c for Hitachi SH-4..."
          
          cd $GITHUB_WORKSPACE
          
          if [ -f "Makefile" ]; then
            make clean && make
          else
            sh-elf-gcc -O3 -fomit-frame-pointer -ml -m4-single-only \
              -I${KOS_BASE}/include -I${KOS_BASE}/kernel/arch/dreamcast/include \
              -L${KOS_BASE}/lib/dreamcast -Wl,-Ttext=0x8c010000 \
              FLYINGCUBE_DREAMCAST.c -o flyingcube.elf \
              -lkos -lc -lgcc || echo "Toolchain compiler path requires setup."
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flyingcube-dreamcast-build
          path: |
            *.elf
            *.bin
