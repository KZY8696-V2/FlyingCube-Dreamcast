name: Build FLYINGCUBE DREAMCAST

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Resmi KallistiOS Docker imajını kullanıyoruz (Her şey hazır gelir)
    container:
      image: kallistios/kos:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile FLYINGCUBE_DREAMCAST.c
        run: |
          echo "=========================================="
          echo "Compiling FLYINGCUBE_DREAMCAST.c for Hitachi SH-4..."
          echo "=========================================="
          
          # Resmi imajdaki environ.sh dosyasını doğru yoldan yüklüyoruz
          source /opt/toolchain/dc/kos/environ.sh
          
          # Eğer bir Makefile varsa 'make', yoksa doğrudan sh-elf-gcc çalıştırır
          if [ -f "Makefile" ]; then
            make clean && make
          else
            sh-elf-gcc -O3 -fomit-frame-pointer -ml -m4-single-only \
              -I${KOS_BASE}/include -I${KOS_BASE}/kernel/arch/dreamcast/include \
              -L${KOS_BASE}/lib/dreamcast -Wl,-Ttext=0x8c010000 \
              FLYINGCUBE_DREAMCAST.c -o flyingcube.elf \
              -lkos -lc -lgcc
          fi
          
          # ELF dosyasını strip et
          if [ -f "flyingcube.elf" ]; then
            echo "Stripping ELF binary..."
            sh-elf-strip flyingcube.elf
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flyingcube-dreamcast-build
          path: |
            *.elf
            *.bin
