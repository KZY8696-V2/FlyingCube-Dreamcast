name: Build and Package FLYINGCUBE DREAMCAST to CDI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget libelf-dev libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex libssl-dev libpng-dev genisoimage make

      - name: Setup KallistiOS & Toolchain (dc-chain)
        run: |
          echo "Setting up official KallistiOS paths..."
          sudo mkdir -p /opt/toolchains/dc
          sudo chown -R $USER:$USER /opt/toolchains/dc
          
          # Clone KallistiOS
          git clone https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
          cd /opt/toolchains/dc/kos
          cp doc/environ.sh.sample environ.sh
          
          # Doğrudan utils/dc-chain dizinine gidiyoruz (En güncel KOS yapısı)
          if [ -d "utils/dc-chain" ]; then
            cd utils/dc-chain
          else
            # Alternatif olarak dc-chain klasörünü arayıp içine gir
            cd $(find /opt/toolchains/dc/kos -type d -name "dc-chain" | head -n 1)
          fi
          
          echo "Current working directory for dc-chain: $(pwd)"
          
          # Konfigürasyon dosyası
          if [ -f "conf/build.mk.sample" ]; then
            cp conf/build.mk.sample build.mk
          else
            echo "DOWNLOAD_METHOD=wget" > build.mk
            echo "GCC_VERSION=13.2.0" >> build.mk
          fi
          
          sed -i 's/^#\?\(DOWNLOAD_METHOD=\).*/\1wget/' build.mk || true
          
          # dc-chain çalıştırma
          ./download.sh
          ./unpack.sh
          make

      - name: Compile FLYINGCUBE_DREAMCAST.c & Package CDI
        run: |
          export KOS_BASE=/opt/toolchains/dc/kos
          export KOS_PORTS=/opt/toolchains/dc/kos-ports
          export PATH=/opt/toolchains/dc/sh-elf/bin:$PATH
          
          source $KOS_BASE/environ.sh

          echo "Compiling FLYINGCUBE_DREAMCAST.c for Hitachi SH-4..."
          cd $GITHUB_WORKSPACE
          
          # Derleme işlemi
          sh-elf-gcc -O3 -fomit-frame-pointer -ml -m4-single-only \
            -I${KOS_BASE}/include -I${KOS_BASE}/kernel/arch/dreamcast/include \
            -L${KOS_BASE}/lib/dreamcast -Wl,-Ttext=0x8c010000 \
            FLYINGCUBE_DREAMCAST.c -o flyingcube.elf \
            -lkos -lc -lgcc

          # ELF dosyasını binary (BIN) formatına dönüştür
          sh-elf-objcopy -O binary flyingcube.elf 1st_read.bin
          
          # Dreamcast IP.bin oluşturma
          gcc ${KOS_BASE}/utils/makeip/makeip.c -o makeip
          ./makeip IP.BIN "FLYINGCUBE DREAMCAST" "Homebrew Arcade Game"
          
          # CDI imajını paketleme
          mkisofs -G IP.BIN -joliet -rock -volid "FLYINGCUBE" -o flyingcube.iso .
          mv flyingcube.iso flyingcube.cdi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flyingcube-dreamcast-cdi
          path: |
            *.elf
            *.bin
            *.cdi
            *.iso
